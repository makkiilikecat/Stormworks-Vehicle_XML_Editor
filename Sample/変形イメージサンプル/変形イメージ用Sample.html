<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Shear/Stretch Pattern Tester</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; font-family: sans-serif; }
        canvas { display: block; }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        #controls label { font-weight: bold; }
        #info { margin-top: 5px; font-size: 0.9em; }
        select, button { padding: 5px; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div id="controls">
        <label for="patternSelect">Operation Pattern:</label>
        <select id="patternSelect">
            <option value="0">1: Original Fixed Plane + Local Vec + Sensitivity</option>
            <option value="1">2: Fixed Plane + World Vec (No Sensitivity/Rounding)</option>
            <option value="2">3: Camera Parallel Plane (Shear)</option>
            <option value="3">4: Camera Ray Intersection Plane (Stretch)</option>
            <option value="4">5: Direct Mapping (Shear - Simplified)</option>
            <option value="5">6: Direct Mapping (Stretch - Simplified)</option>
            <option value="6">7: Screen Space Movement Mapping</option>
            <option value="7">8: Incremental Screen Delta</option>
        </select>
        <button id="resetButton">Reset Block</button>
        <div id="info">
            Left Drag: Shear<br>
            Shift + Left Drag: Stretch<br>
            Right Drag: Rotate View<br>
            Middle Drag: Pan View<br>
            Wheel: Zoom
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Constants ---
        const BLOCK_SIZE = 1.0; // ブロックサイズ (可視化のため大きめ)
        const STRETCH_SENSITIVITY = 4.0;
        const SHEAR_SENSITIVITY = 4.0;

        // --- Global Variables ---
        let scene, camera, renderer, controls;
        let block, initialMatrix;
        const mouse = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        const clock = new THREE.Clock();

        // Drag state
        const dragState = {
            isDragging: false,
            mode: null, // 'shear' or 'stretch'
            startPoint: new THREE.Vector3(), // Intersection point in world space
            currentPoint: new THREE.Vector3(),
            startMouse: new THREE.Vector2(), // NDC
            currentMouse: new THREE.Vector2(), // NDC
            lastMouse: new THREE.Vector2(), // Previous NDC for delta calculation
            face: null, // Intersected face { normal: Vector3 (world), materialIndex: number }
            dragPlane: new THREE.Plane(), // For patterns using fixed plane
            initialBlockMatrix: new THREE.Matrix4(),
        };

        // Pattern selection
        let currentPatternIndex = 0;
        const patternSelect = document.getElementById('patternSelect');
        const resetButton = document.getElementById('resetButton');

        // --- Matrix Utils (Ported/Simplified) ---
        const _mat = new THREE.Matrix4();
        const _vec = new THREE.Vector3();
        const _pos = new THREE.Vector3();
        const _quat = new THREE.Quaternion();
        const _scale = new THREE.Vector3();

        function getBasisVector(matrix, axisIndex, targetVector = new THREE.Vector3()) {
            const te = matrix.elements;
            const offset = axisIndex * 4; // Columns are basis vectors
            return targetVector.set(te[offset + 0], te[offset + 1], te[offset + 2]);
        }

        function setBasisVector(matrix, axisIndex, vector, round = false) {
            const te = matrix.elements;
            const offset = axisIndex * 4;
            te[offset + 0] = round ? Math.round(vector.x) : vector.x;
            te[offset + 1] = round ? Math.round(vector.y) : vector.y;
            te[offset + 2] = round ? Math.round(vector.z) : vector.z;
        }

        function roundMatrixElements(matrix) {
            const te = matrix.elements;
            for (let i = 0; i < 12; i++) { // Only rotation/scale/shear part (3x4, skip translation)
                if ((i + 1) % 4 !== 0) { // Skip 4th element of each column
                     te[i] = Math.round(te[i]);
                }
            }
             // Ensure last row is 0, 0, 0, 1 if modifying matrix directly
            te[3] = 0; te[7] = 0; te[11] = 0; te[15] = 1;
        }

        function decomposeMatrix(matrix, position, quaternion, scale) {
            matrix.decompose(position, quaternion, scale);
        }

        function composeMatrix(position, quaternion, scale, targetMatrix) {
            targetMatrix.compose(position, quaternion, scale);
        }

        // --- Helper Functions ---
        function getIntersectedFace(mouseCoords) {
            raycaster.setFromCamera(mouseCoords, camera);
            const intersects = raycaster.intersectObject(block);
            if (intersects.length > 0 && intersects[0].face) {
                const intersection = intersects[0];
                // Face normal in world space
                const worldNormal = intersection.face.normal.clone();
                worldNormal.transformDirection(block.matrixWorld); // Apply object rotation
                worldNormal.normalize();
                return {
                    point: intersection.point, // World space intersection
                    normal: worldNormal,
                    materialIndex: intersection.face.materialIndex // Index of the face (0-5)
                };
            }
            return null;
        }

        // Calculate intersection with a plane defined by normal and point
        function intersectPlane(mouseCoords, plane, target) {
            raycaster.setFromCamera(mouseCoords, camera);
            return raycaster.ray.intersectPlane(plane, target);
        }

        // Calculate intersection with a plane parallel to the camera view plane
        function intersectCameraParallelPlane(mouseCoords, pointOnPlane, target) {
            raycaster.setFromCamera(mouseCoords, camera);
            // Plane normal is the camera's view direction (inverted Z axis)
            const planeNormal = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(planeNormal, pointOnPlane);
            return raycaster.ray.intersectPlane(plane, target);
        }

        // Find the local axis index (0, 1, 2 for X, Y, Z) most aligned with a world normal
        function getLocalAxisIndexFromWorldNormal(worldNormal, objectMatrix) {
            const localNormal = worldNormal.clone();
            _mat.copy(objectMatrix).invert(); // Get inverse matrix for world-to-local
            localNormal.transformDirection(_mat); // Transform normal to local space
            localNormal.normalize();

            let maxDot = -1;
            let axisIndex = 0;
            for (let i = 0; i < 3; i++) {
                _vec.set(0, 0, 0).setComponent(i, 1); // Local axis vector
                const dot = Math.abs(localNormal.dot(_vec));
                if (dot > maxDot) {
                    maxDot = dot;
                    axisIndex = i;
                }
            }
            return axisIndex;
        }

        // --- Pattern Implementations ---

        // Pattern 1: Original Fixed Plane + Local Vec + Sensitivity
        function applyShearPattern1(dragInfo) {
            const { face, startPoint, currentPoint, initialBlockMatrix } = dragInfo;
            if (!face) return;

            const dragVectorWorld = currentPoint.clone().sub(startPoint);

            // Get local axis index corresponding to the face normal
            const normalAxisIndex = getLocalAxisIndexFromWorldNormal(face.normal, initialBlockMatrix);

            // Calculate shear vector parallel to the plane in world space
            const normalComponent = face.normal.clone().multiplyScalar(dragVectorWorld.dot(face.normal));
            const shearVectorWorld = dragVectorWorld.clone().sub(normalComponent);

            // Transform world shear vector to local shear vector
            _mat.copy(initialBlockMatrix).invert();
            const shearVectorLocal = shearVectorWorld.clone().transformDirection(_mat);

            // Calculate shear amounts for the other two axes
            const otherAxes = [0, 1, 2].filter(i => i !== normalAxisIndex);
            const shearAmount1 = Math.round(shearVectorLocal.getComponent(otherAxes[0]) * SHEAR_SENSITIVITY);
            const shearAmount2 = Math.round(shearVectorLocal.getComponent(otherAxes[1]) * SHEAR_SENSITIVITY);

            // Apply shear (modify basis vector corresponding to the normal)
            const currentMatrix = initialBlockMatrix.clone(); // Start from initial matrix for this drag
            const normalBasis = getBasisVector(currentMatrix, normalAxisIndex);
            const basis1 = getBasisVector(currentMatrix, otherAxes[0]);
            const basis2 = getBasisVector(currentMatrix, otherAxes[1]);

            normalBasis.addScaledVector(basis1, shearAmount1);
            normalBasis.addScaledVector(basis2, shearAmount2);

            setBasisVector(currentMatrix, normalAxisIndex, normalBasis, true); // Round elements
            roundMatrixElements(currentMatrix); // Round other elements too
            block.matrix.copy(currentMatrix);
        }

        function applyStretchPattern1(dragInfo) {
            const { face, startPoint, currentPoint, initialBlockMatrix } = dragInfo;
            if (!face) return;

            const dragVectorWorld = currentPoint.clone().sub(startPoint);
            const dragAmount = dragVectorWorld.dot(face.normal); // Project onto normal

            // Get local axis index corresponding to the face normal
            const normalAxisIndex = getLocalAxisIndexFromWorldNormal(face.normal, initialBlockMatrix);

            // Apply stretch (modify length of the basis vector)
            const currentMatrix = initialBlockMatrix.clone();
            const basisVector = getBasisVector(currentMatrix, normalAxisIndex);
            const currentLength = basisVector.length();
            const newLength = Math.max(0.1, Math.round(currentLength + dragAmount * STRETCH_SENSITIVITY)); // Min length 0.1, rounded

            if (Math.abs(newLength - currentLength) >= 0.5) { // Apply only if changed significantly
                basisVector.normalize().multiplyScalar(newLength);
                setBasisVector(currentMatrix, normalAxisIndex, basisVector, true);
                roundMatrixElements(currentMatrix);
                block.matrix.copy(currentMatrix);
            }
        }

        // Pattern 2: Fixed Plane + World Vec (No Sensitivity/Rounding)
        function applyShearPattern2(dragInfo) {
            const { face, startPoint, currentPoint, initialBlockMatrix } = dragInfo;
            if (!face) return;

            const dragVectorWorld = currentPoint.clone().sub(startPoint);

            const normalAxisIndex = getLocalAxisIndexFromWorldNormal(face.normal, initialBlockMatrix);
            const otherAxes = [0, 1, 2].filter(i => i !== normalAxisIndex);

            // Calculate shear vector parallel to the plane in world space
            const normalComponent = face.normal.clone().multiplyScalar(dragVectorWorld.dot(face.normal));
            const shearVectorWorld = dragVectorWorld.clone().sub(normalComponent);

            // Apply shear in world space by modifying the basis vector
            const currentMatrix = initialBlockMatrix.clone();
            const normalBasis = getBasisVector(currentMatrix, normalAxisIndex);

            // How much to add based on the world shear vector projected onto the other local axes?
            // Simpler: Add the world shear vector directly to the normal basis vector? -> Might distort
            // Alternative: Decompose, add shear offset in local space, recompose?

            // Let's try adding the world shear vector scaled somehow
            // This is non-trivial to map world drag directly to local shear without distortion
            // Trying a simplified approach: add world shear directly to the normal basis
            // This is likely NOT mathematically correct for pure shear but demonstrates world vec use
            normalBasis.add(shearVectorWorld); // Warning: May scale/rotate unexpectedly

            setBasisVector(currentMatrix, normalAxisIndex, normalBasis, false); // No rounding
            block.matrix.copy(currentMatrix);
        }

         function applyStretchPattern2(dragInfo) {
             const { face, startPoint, currentPoint, initialBlockMatrix } = dragInfo;
             if (!face) return;

             const dragVectorWorld = currentPoint.clone().sub(startPoint);
             const dragAmount = dragVectorWorld.dot(face.normal); // World distance along normal

             const normalAxisIndex = getLocalAxisIndexFromWorldNormal(face.normal, initialBlockMatrix);

             const currentMatrix = initialBlockMatrix.clone();
             const basisVector = getBasisVector(currentMatrix, normalAxisIndex);
             const currentLength = basisVector.length();
             const newLength = Math.max(0.1, currentLength + dragAmount); // No sensitivity/rounding

             if (Math.abs(newLength - currentLength) > 1e-4) {
                 basisVector.normalize().multiplyScalar(newLength);
                 setBasisVector(currentMatrix, normalAxisIndex, basisVector, false);
                 block.matrix.copy(currentMatrix);
             }
         }

        // Pattern 3: Camera Parallel Plane (Shear)
        function applyShearPattern3(dragInfo) {
            const { face, startPoint, currentMouse, lastMouse, initialBlockMatrix } = dragInfo;
            if (!face) return;

            // Calculate intersection on a plane parallel to camera view, passing through the start point
            const intersectionNow = intersectCameraParallelPlane(currentMouse, startPoint, new THREE.Vector3());
            const intersectionLast = intersectCameraParallelPlane(lastMouse, startPoint, new THREE.Vector3());

            if (intersectionNow && intersectionLast) {
                const dragVectorWorld = intersectionNow.clone().sub(intersectionLast);

                // Calculate shear vector parallel to the original face plane
                const normalComponent = face.normal.clone().multiplyScalar(dragVectorWorld.dot(face.normal));
                const shearVectorWorld = dragVectorWorld.clone().sub(normalComponent);

                // Apply this world shear vector incrementally to the current matrix
                const currentMatrix = block.matrix.clone(); // Operate on current state
                const normalAxisIndex = getLocalAxisIndexFromWorldNormal(face.normal, currentMatrix); // Use current matrix for axis index
                const normalBasis = getBasisVector(currentMatrix, normalAxisIndex);

                // Add the world shear vector to the normal basis (simplified approach)
                normalBasis.add(shearVectorWorld);

                setBasisVector(currentMatrix, normalAxisIndex, normalBasis, false);
                block.matrix.copy(currentMatrix);
            }
        }

        // Pattern 4: Camera Ray Intersection Plane (Stretch)
        function applyStretchPattern4(dragInfo) {
             const { face, startPoint, currentMouse, initialBlockMatrix } = dragInfo;
             if (!face) return;

             // Define a plane perpendicular to the face normal, passing through the start point
             // (Alternative: Plane facing the camera passing through start point?)
             // Let's try plane perpendicular to normal first
             const perpPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(face.normal, startPoint);

             // Find intersection of camera ray with this plane
             const intersectionNow = intersectPlane(currentMouse, perpPlane, new THREE.Vector3());

             if (intersectionNow) {
                 // Vector from start point to current intersection on the perpendicular plane
                 const vectorOnPlane = intersectionNow.clone().sub(startPoint);
                 // Project this vector onto the face normal to get the stretch amount
                 const dragAmount = vectorOnPlane.dot(face.normal); // This should be close to zero if perp

                 // Let's redefine: Plane IS the face plane, find intersection
                 const facePlane = new THREE.Plane().setFromNormalAndCoplanarPoint(face.normal, startPoint);
                 const intersectionOnFacePlane = intersectPlane(currentMouse, facePlane, new THREE.Vector3());

                 if(intersectionOnFacePlane){
                    // Amount to stretch is the distance along the normal from the start point
                    const dragAmount = intersectionOnFacePlane.clone().sub(startPoint).dot(face.normal);

                    const normalAxisIndex = getLocalAxisIndexFromWorldNormal(face.normal, initialBlockMatrix);
                    const currentMatrix = initialBlockMatrix.clone();
                    const basisVector = getBasisVector(currentMatrix, normalAxisIndex);
                    const currentLength = basisVector.length();
                    const newLength = Math.max(0.1, currentLength + dragAmount);

                    if (Math.abs(newLength - currentLength) > 1e-4) {
                        basisVector.normalize().multiplyScalar(newLength);
                        setBasisVector(currentMatrix, normalAxisIndex, basisVector, false);
                        block.matrix.copy(currentMatrix);
                    }
                 }
             }
         }

        // Pattern 5: Direct Mapping (Shear - Simplified)
        function applyShearPattern5(dragInfo) {
            const { face, startPoint, currentMouse, initialBlockMatrix } = dragInfo;
            if (!face) return;

            // Goal: Move the center of the face to the ray intersection point on a plane parallel to the face
            const targetPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(face.normal, startPoint);
            const targetPoint = intersectPlane(currentMouse, targetPlane, new THREE.Vector3());

            if (targetPoint) {
                const dragVectorWorld = targetPoint.clone().sub(startPoint);

                // Calculate shear vector parallel to the plane
                const normalComponent = face.normal.clone().multiplyScalar(dragVectorWorld.dot(face.normal));
                const shearVectorWorld = dragVectorWorld.clone().sub(normalComponent);

                // Apply as in Pattern 2 (simplified world vec addition)
                const currentMatrix = initialBlockMatrix.clone();
                const normalAxisIndex = getLocalAxisIndexFromWorldNormal(face.normal, initialBlockMatrix);
                const normalBasis = getBasisVector(currentMatrix, normalAxisIndex);
                normalBasis.add(shearVectorWorld);
                setBasisVector(currentMatrix, normalAxisIndex, normalBasis, false);
                block.matrix.copy(currentMatrix);
            }
        }

        // Pattern 6: Direct Mapping (Stretch - Simplified)
        function applyStretchPattern6(dragInfo) {
             const { face, startPoint, currentMouse, initialBlockMatrix } = dragInfo;
             if (!face) return;

             // Goal: Move the face so its plane intersects the camera ray at the mouse position
             const targetPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(face.normal, startPoint); // Start plane
             const targetPoint = intersectPlane(currentMouse, targetPlane, new THREE.Vector3());

             if(targetPoint){
                 // Calculate distance along normal needed to reach targetPoint
                 const dragAmount = targetPoint.clone().sub(startPoint).dot(face.normal);

                 // Apply as in Pattern 2
                 const normalAxisIndex = getLocalAxisIndexFromWorldNormal(face.normal, initialBlockMatrix);
                 const currentMatrix = initialBlockMatrix.clone();
                 const basisVector = getBasisVector(currentMatrix, normalAxisIndex);
                 const currentLength = basisVector.length();
                 const newLength = Math.max(0.1, currentLength + dragAmount);

                 if (Math.abs(newLength - currentLength) > 1e-4) {
                     basisVector.normalize().multiplyScalar(newLength);
                     setBasisVector(currentMatrix, normalAxisIndex, basisVector, false);
                     block.matrix.copy(currentMatrix);
                 }
             }
         }

        // Pattern 7: Screen Space Movement Mapping
        function applyShearPattern7(dragInfo) {
            const { face, currentMouse, lastMouse, initialBlockMatrix } = dragInfo;
            if (!face) return;

            const deltaX = (currentMouse.x - lastMouse.x) * 2; // Scale screen delta
            const deltaY = (currentMouse.y - lastMouse.y) * 2;

            // Map screen delta to world space movement parallel to the face plane
            const cameraRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            const cameraUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);

            const moveRight = cameraRight.clone().multiplyScalar(deltaX);
            const moveUp = cameraUp.clone().multiplyScalar(deltaY);
            const dragVectorWorld = moveRight.add(moveUp);

            // Project onto the face plane
            const normalComponent = face.normal.clone().multiplyScalar(dragVectorWorld.dot(face.normal));
            const shearVectorWorld = dragVectorWorld.clone().sub(normalComponent);

            // Apply incrementally
            const currentMatrix = block.matrix.clone();
            const normalAxisIndex = getLocalAxisIndexFromWorldNormal(face.normal, currentMatrix);
            const normalBasis = getBasisVector(currentMatrix, normalAxisIndex);
            normalBasis.add(shearVectorWorld); // Simplified add
            setBasisVector(currentMatrix, normalAxisIndex, normalBasis, false);
            block.matrix.copy(currentMatrix);
        }

        function applyStretchPattern7(dragInfo) {
            const { face, currentMouse, lastMouse, initialBlockMatrix } = dragInfo;
            if (!face) return;

            // Use vertical mouse movement to control stretch amount along normal
            const deltaY = (currentMouse.y - lastMouse.y) * 4; // Scale vertical delta more
            const dragAmount = deltaY; // Directly use scaled delta as amount

            // Apply incrementally
            const currentMatrix = block.matrix.clone();
            const normalAxisIndex = getLocalAxisIndexFromWorldNormal(face.normal, currentMatrix);
            const basisVector = getBasisVector(currentMatrix, normalAxisIndex);
            const currentLength = basisVector.length();
            const newLength = Math.max(0.1, currentLength + dragAmount);

            if (Math.abs(newLength - currentLength) > 1e-4) {
                basisVector.normalize().multiplyScalar(newLength);
                setBasisVector(currentMatrix, normalAxisIndex, basisVector, false);
                block.matrix.copy(currentMatrix);
            }
        }

        // Pattern 8: Incremental Screen Delta
         function applyShearPattern8(dragInfo) {
            const { face, currentMouse, lastMouse, initialBlockMatrix } = dragInfo;
             if (!face) return;

             const deltaX = (currentMouse.x - lastMouse.x) * 0.1; // Small increments
             const deltaY = (currentMouse.y - lastMouse.y) * 0.1;

             const currentMatrix = block.matrix.clone();
             const normalAxisIndex = getLocalAxisIndexFromWorldNormal(face.normal, currentMatrix);
             const otherAxes = [0, 1, 2].filter(i => i !== normalAxisIndex);

             const normalBasis = getBasisVector(currentMatrix, normalAxisIndex);
             const basis1 = getBasisVector(currentMatrix, otherAxes[0]);
             const basis2 = getBasisVector(currentMatrix, otherAxes[1]);

             // Add scaled basis vectors based on screen delta
             normalBasis.addScaledVector(basis1, deltaX);
             normalBasis.addScaledVector(basis2, deltaY); // Map Y delta to second axis? Arbitrary.

             setBasisVector(currentMatrix, normalAxisIndex, normalBasis, false);
             block.matrix.copy(currentMatrix);
         }

         function applyStretchPattern8(dragInfo) {
            const { face, currentMouse, lastMouse, initialBlockMatrix } = dragInfo;
             if (!face) return;

             const deltaY = (currentMouse.y - lastMouse.y) * 0.2; // Small increments
             const dragAmount = deltaY;

             const currentMatrix = block.matrix.clone();
             const normalAxisIndex = getLocalAxisIndexFromWorldNormal(face.normal, currentMatrix);
             const basisVector = getBasisVector(currentMatrix, normalAxisIndex);
             const currentLength = basisVector.length();
             const newLength = Math.max(0.1, currentLength + dragAmount);

             if (Math.abs(newLength - currentLength) > 1e-4) {
                 basisVector.normalize().multiplyScalar(newLength);
                 setBasisVector(currentMatrix, normalAxisIndex, basisVector, false);
                 block.matrix.copy(currentMatrix);
             }
         }

        const patternFunctions = [
            { shear: applyShearPattern1, stretch: applyStretchPattern1 },
            { shear: applyShearPattern2, stretch: applyStretchPattern2 },
            { shear: applyShearPattern3, stretch: applyStretchPattern4 }, // Mixed for demo
            { shear: applyShearPattern3, stretch: applyStretchPattern4 }, // Mixed for demo
            { shear: applyShearPattern5, stretch: applyStretchPattern6 },
            { shear: applyShearPattern5, stretch: applyStretchPattern6 },
            { shear: applyShearPattern7, stretch: applyStretchPattern7 },
            { shear: applyShearPattern8, stretch: applyStretchPattern8 },
        ];

        // --- Event Handlers ---
        function updateMouseCoords(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        }

        function onPointerDown(event) {
            if (event.button !== 0) return; // Only left click for transform

            updateMouseCoords(event);
            const faceInfo = getIntersectedFace(mouse);

            if (faceInfo) {
                dragState.isDragging = true;
                dragState.mode = event.shiftKey ? 'stretch' : 'shear';
                dragState.startPoint.copy(faceInfo.point);
                dragState.currentPoint.copy(faceInfo.point);
                dragState.startMouse.copy(mouse);
                dragState.currentMouse.copy(mouse);
                dragState.lastMouse.copy(mouse);
                dragState.face = { normal: faceInfo.normal.clone(), materialIndex: faceInfo.materialIndex };
                dragState.dragPlane.setFromNormalAndCoplanarPoint(faceInfo.normal, faceInfo.point);
                dragState.initialBlockMatrix.copy(block.matrix); // Store matrix at drag start
                controls.enabled = false; // Disable camera controls during drag
                document.body.style.cursor = 'grabbing';
            }
        }

        function onPointerMove(event) {
            updateMouseCoords(event);
            if (!dragState.isDragging) return;

            dragState.lastMouse.copy(dragState.currentMouse); // Store previous mouse pos
            dragState.currentMouse.copy(mouse);

            // Update currentPoint based on the fixed dragPlane for relevant patterns
            intersectPlane(mouse, dragState.dragPlane, dragState.currentPoint);

            // Apply the selected pattern's logic
            const patternFuncs = patternFunctions[currentPatternIndex];
            if (dragState.mode === 'shear' && patternFuncs.shear) {
                patternFuncs.shear(dragState);
            } else if (dragState.mode === 'stretch' && patternFuncs.stretch) {
                patternFuncs.stretch(dragState);
            }
        }

        function onPointerUp(event) {
            if (event.button !== 0) return;
            if (dragState.isDragging) {
                dragState.isDragging = false;
                dragState.mode = null;
                dragState.face = null;
                controls.enabled = true; // Re-enable camera controls
                document.body.style.cursor = 'default';
            }
        }

        function onKeyDown(event) {
            // Shift key state is checked in onPointerDown
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function resetBlockTransform() {
             block.matrix.copy(initialMatrix);
        }

        // --- Init Function ---
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xdddddd);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(1.5, 1.5, 2.5);

            // Renderer
            const canvas = document.querySelector('#c');
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.1;
            controls.screenSpacePanning = false; // Keep panning relative to ground
             controls.mouseButtons = {
                 LEFT: THREE.MOUSE.ROTATE, // Disable left click rotate
                 MIDDLE: THREE.MOUSE.PAN,
                 RIGHT: THREE.MOUSE.ROTATE
             };
             controls.enablePan = true; // Allow middle mouse pan


            // Light
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            // Grid
            const gridHelper = new THREE.GridHelper(20, 20, 0x888888, 0xcccccc);
            scene.add(gridHelper);
            const axesHelper = new THREE.AxesHelper(1);
            scene.add(axesHelper);


            // Block
            const geometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
             // Different color for each face for easier identification
             const materials = [
                 new THREE.MeshStandardMaterial({color: 0xff0000}), // +X red
                 new THREE.MeshStandardMaterial({color: 0x990000}), // -X dark red
                 new THREE.MeshStandardMaterial({color: 0x00ff00}), // +Y green
                 new THREE.MeshStandardMaterial({color: 0x009900}), // -Y dark green
                 new THREE.MeshStandardMaterial({color: 0x0000ff}), // +Z blue
                 new THREE.MeshStandardMaterial({color: 0x000099})  // -Z dark blue
             ];
            block = new THREE.Mesh(geometry, materials);
            block.matrixAutoUpdate = false;
            initialMatrix = block.matrix.clone(); // Store initial state
            scene.add(block);

            // UI Listeners
            patternSelect.addEventListener('change', (event) => {
                currentPatternIndex = parseInt(event.target.value, 10);
                resetBlockTransform(); // Reset block when changing pattern
            });
            resetButton.addEventListener('click', resetBlockTransform);

            // Event Listeners
            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            renderer.domElement.addEventListener('pointermove', onPointerMove);
            renderer.domElement.addEventListener('pointerup', onPointerUp);
            // Prevent right-click menu on canvas
            renderer.domElement.addEventListener('contextmenu', (event) => event.preventDefault());
            window.addEventListener('resize', onWindowResize);

             // Initial pattern selection
             patternSelect.value = currentPatternIndex.toString();
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (controls.enabled) { // Only update controls if not dragging
                controls.update(delta);
            }

            renderer.render(scene, camera);
        }

        // --- Start ---
        init();
        animate();

    </script>
</body>
</html>
