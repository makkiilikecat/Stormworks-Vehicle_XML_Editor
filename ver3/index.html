<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stormworks Vehicle Editor</title>
    </head>
<body>
    <canvas id="three-canvas"></canvas>

    <div id="inventory-overlay"></div>

    <div id="top-toolbar" class="toolbar">
        <button class="toolbar-button mode-button" data-mode="NORMAL" title="通常モード (Escape)"><span class="icon-text">➕</span></button>
        <button class="toolbar-button mode-button" data-mode="DELETE" title="削除モード (X)"><span class="icon-text">🗑️</span></button>
        <button class="toolbar-button mode-button" data-mode="XML_EDIT" title="XML編集モード (Shift+E)"><span class="icon-text">✏️</span></button>
        <button class="toolbar-button mode-button" data-mode="RANGE_SELECT" title="範囲選択モード (Shift+S)"><span class="icon-text">🔲</span></button>
        <button class="toolbar-button mode-button" data-mode="PAINT" title="ペイントモード (Shift+C)"><span class="icon-text">🎨</span></button>
        <hr class="vertical-divider">
        <button id="toggle-stick-button" class="toolbar-button active" title="移動スティック表示切替"><span class="icon-text">🕹️</span></button>
        <hr class="vertical-divider">
        <button id="toggle-bg-button" class="toolbar-button" title="背景色切替 (ダーク/ライト)"><span class="icon-text">🌓</span></button>
    </div>

    <div id="left-toolbar" class="toolbar">
        <button class="toolbar-button paint-tool-button active" data-paint-tool="normal" title="通常ペイント"><span class="icon-text">🖌️</span></button>
        <button class="toolbar-button paint-tool-button" data-paint-tool="special" title="特殊ペイント(Additive)"><span class="icon-text">✨</span></button>
        <button class="toolbar-button paint-tool-button" data-paint-tool="replace" title="色置き換え"><span class="icon-text">🔄</span></button>
        <hr class="horizontal-divider">
        <div id="color-palette-container">
            <button class="color-swatch" data-color="C2C3C7" style="background-color: #C2C3C7;" title="#C2C3C7"></button>
            <button class="color-swatch" data-color="FF0000" style="background-color: #FF0000;" title="#FF0000"></button>
            <button class="color-swatch" data-color="00FF00" style="background-color: #00FF00;" title="#00FF00"></button>
            <button class="color-swatch" data-color="0000FF" style="background-color: #0000FF;" title="#0000FF"></button>
            </div>
        <hr class="horizontal-divider">
        <button id="toggle-rgb-sliders-button" class="toolbar-button" title="RGBスライダー表示切替"><span class="icon-text">🔧</span></button>
        <div id="rgb-sliders-container" style="display: none;">
            <div>R: <input type="range" id="slider-r" min="0" max="255"> <span id="value-r">--</span></div>
            <div>G: <input type="range" id="slider-g" min="0" max="255"> <span id="value-g">--</span></div>
            <div>B: <input type="range" id="slider-b" min="0" max="255"> <span id="value-b">--</span></div>
            <div id="color-preview" style="width: 30px; height: 30px; border: 1px solid #fff; margin-top: 5px;"></div>
        </div>
    </div>

    <div id="right-toolbar" class="toolbar">
        <button class="toolbar-button range-only" data-action="COPY" title="コピー (Ctrl+C)" style="display: none;"><span class="icon-text">📄</span></button>
        <button class="toolbar-button range-only" data-action="CUT" title="カット (Ctrl+X)" style="display: none;"><span class="icon-text">✂️</span></button>
        <button class="toolbar-button range-only" data-action="PASTE" title="ペースト (Ctrl+V)" style="display: none;"><span class="icon-text">📋</span></button>
        <button class="toolbar-button range-only" data-action="CLEAR_CLIPBOARD" title="クリップボードクリア (Shift+Q)" style="display: none;"><span class="icon-text">❌</span></button>
        <hr class="horizontal-divider range-only" style="display: none;">
        <button class="toolbar-button" data-action="UNDO" title="元に戻す (Ctrl+Z)"><span class="icon-text">↩️</span></button>
        <button class="toolbar-button" data-action="REDO" title="やり直し (Ctrl+Y)"><span class="icon-text">↪️</span></button>
        <hr class="horizontal-divider">
        <button class="toolbar-button" data-action="SYMMETRY_X" title="X軸対称"><span class="icon-text">X</span></button>
        <button class="toolbar-button" data-action="SYMMETRY_Y" title="Y軸対称"><span class="icon-text">Y</span></button>
        <button class="toolbar-button" data-action="SYMMETRY_Z" title="Z軸対称"><span class="icon-text">Z</span></button>
        <hr class="horizontal-divider">
        <label for="file-input-main" class="toolbar-button" title="読込" style="cursor: pointer;"><span class="icon-text">📂</span></label>
        <input type="file" id="file-input-main" accept=".xml" style="display: none;">
        <button class="toolbar-button" data-action="SAVE" title="保存"><span class="icon-text">💾</span></button>
        <hr class="horizontal-divider">
        <button id="fullscreen-button" class="toolbar-button" title="フルスクリーン切替"><span class="icon-text">⛶</span></button>
    </div>

    <div id="bottom-toolbar" class="toolbar">
        <button class="hotbar-item active" data-block-id="01_block" title="Block"><span class="icon-text">🧱</span></button>
        <button class="hotbar-item" data-block-id="02_wedge" title="Wedge"><span class="icon-text">◤</span></button>
        <button class="hotbar-item" data-block-id="light" title="Light"><span class="icon-text">💡</span></button>
        <button class="hotbar-item" data-block-id="button" title="Button"><span class="icon-text">🔘</span></button>
        <button class="hotbar-item" data-block-id="seat_pilot" title="Pilot Seat"><span class="icon-text">💺</span></button>
        <hr class="vertical-divider">
        <button id="toggle-inventory-button" class="toolbar-button" title="インベントリ開閉"><span class="icon-text">🎒</span></button>
    </div>

    <div id="info-display">
        <div id="current-mode-text" style="font-weight: bold; margin-bottom: 5px;">モード: --</div>
        <div>総ブロック数: <span id="info-block-count">--</span></div>
        <div>質量: <span id="info-mass">----</span> kg</div>
        <div>コスト: $<span id="info-cost">----</span></div>
        <table>
             <tr><td>X:</td><td><span id="size-x">--</span> (<span id="size-x-m">--</span>m)</td></tr>
             <tr><td>Y:</td><td><span id="size-y">--</span> (<span id="size-y-m">--</span>m)</td></tr>
             <tr><td>Z:</td><td><span id="size-z">--</span> (<span id="size-z-m">--</span>m)</td></tr>
        </table>
        <div style="display: flex; align-items: center; margin-top: 5px;">
             <button id="battery-save-button" class="toolbar-button fps-unlimited" title="FPS制限切替 (∞ > 60 > 30)" data-fps-mode="0">∞</button>
             <div id="fps-display" style="margin-left: 8px;">FPS: --</div>
        </div>
        <div id="file-operation-status" style="margin-top: 5px; max-height: 5em; overflow-y: auto;"></div>
    </div>

    <div id="xml-edit-panel" style="display: none;">
        <h4>
            XML編集 (選択ブロック)
            <button id="toggle-xml-panel" title="パネルを格納/展開">^</button>
        </h4>
        <div class="edit-section fixed-prop-section">
            <label>座標 (vp):</label>
            <div class="vector3-input">
                X:<input type="number" step="1" id="edit-vp-x" data-property-name="vp.x" data-property-source="standard" data-property-type="number" title="X座標">
                Y:<input type="number" step="1" id="edit-vp-y" data-property-name="vp.y" data-property-source="standard" data-property-type="number" title="Y座標">
                Z:<input type="number" step="1" id="edit-vp-z" data-property-name="vp.z" data-property-source="standard" data-property-type="number" title="Z座標">
            </div>
        </div>
        <div class="edit-section fixed-prop-section">
            <label>向き (t):</label>
            <div class="single-input">
                <input type="number" min="0" max="7" step="1" id="edit-t" data-property-name="t" data-property-source="standard" data-property-type="number" title="t属性">
            </div>
        </div>
        <div class="edit-section fixed-prop-section">
            <label>回転行列 (r):</label>
            <div class="matrix3x3-input">
                <div> <input type="number" step="1" id="edit-r-11" data-property-name="r.0.0" data-property-source="standard" data-property-type="number" title="r[1,1]"> <input type="number" step="1" id="edit-r-21" data-property-name="r.1.0" data-property-source="standard" data-property-type="number" title="r[2,1]"> <input type="number" step="1" id="edit-r-31" data-property-name="r.2.0" data-property-source="standard" data-property-type="number" title="r[3,1]"> </div>
                <div> <input type="number" step="1" id="edit-r-12" data-property-name="r.0.1" data-property-source="standard" data-property-type="number" title="r[1,2]"> <input type="number" step="1" id="edit-r-22" data-property-name="r.1.1" data-property-source="standard" data-property-type="number" title="r[2,2]"> <input type="number" step="1" id="edit-r-32" data-property-name="r.2.1" data-property-source="standard" data-property-type="number" title="r[3,2]"> </div>
                <div> <input type="number" step="1" id="edit-r-13" data-property-name="r.0.2" data-property-source="standard" data-property-type="number" title="r[1,3]"> <input type="number" step="1" id="edit-r-23" data-property-name="r.1.2" data-property-source="standard" data-property-type="number" title="r[2,3]"> <input type="number" step="1" id="edit-r-33" data-property-name="r.2.2" data-property-source="standard" data-property-type="number" title="r[3,3]"> </div>
            </div>
        </div>
        <div id="xml-edit-dynamic-props" class="dynamic-props-container"></div>
        <div id="xml-edit-info" class="info-text">ブロックを選択してください。</div>
    </div>

    <div id="inventory-panel">
        <input type="search" id="inventory-search" placeholder="ブロック名を検索...">
        <div class="inventory-content">
        </div>
    </div>

    <div id="camera-stick">
        <div id="stick-handle"></div>
    </div>

    <div id="range-adjust-dpad">
        <button id="dpad-up">▲</button>
        <button id="dpad-left">◀</button>
        <button id="dpad-right">▶</button>
        <button id="dpad-down">▼</button>
    </div>

</body>
</html>
