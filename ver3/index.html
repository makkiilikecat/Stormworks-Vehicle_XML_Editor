<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stormworks XML Editor (Stage 3.2)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="file-controls">
        <label for="fileInput">ビークルXML:</label>
        <input type="file" id="fileInput" accept=".xml">
        <button id="loadButton">読み込み</button>
        <button id="saveButton">保存</button>
        <span id="file-status"></span> </div>

    <div id="mode-indicator">
        現在のモード: <span id="current-mode-text">通常</span>
    </div>

    <div id="inventory-controls">
        <div>配置ブロック:</div>
        <button class="block-select-button" data-block-id="01_block">基本ブロック</button>
        <button class="block-select-button" data-block-id="02_wedge">ウェッジ</button>
        <div id="current-placement-block">選択中: 基本ブロック</div>
    </div>

    <div id="xml-edit-panel" class="edit-panel" style="display: none;"> <h4>XML編集 (選択ブロック)</h4>
        <div class="edit-section">
            <label>座標 (vp):</label>
            <div class="vector3-input">
                X:<input type="number" step="1" id="edit-vp-x" data-property="vp.x" title="X座標 (XML座標系)">
                Y:<input type="number" step="1" id="edit-vp-y" data-property="vp.y" title="Y座標 (XML座標系)">
                Z:<input type="number" step="1" id="edit-vp-z" data-property="vp.z" title="Z座標 (XML座標系)">
            </div>
        </div>
        <div class="edit-section">
            <label>回転行列 (r):</label>
            <div class="matrix3x3-input">
                <div>
                    <input type="number" step="1" id="edit-r-11" data-row="0" data-col="0" title="r[1,1]">
                    <input type="number" step="1" id="edit-r-21" data-row="1" data-col="0" title="r[2,1]">
                    <input type="number" step="1" id="edit-r-31" data-row="2" data-col="0" title="r[3,1]">
                </div>
                <div>
                    <input type="number" step="1" id="edit-r-12" data-row="0" data-col="1" title="r[1,2]">
                    <input type="number" step="1" id="edit-r-22" data-row="1" data-col="1" title="r[2,2]">
                    <input type="number" step="1" id="edit-r-32" data-row="2" data-col="1" title="r[3,2]">
                </div>
                <div>
                    <input type="number" step="1" id="edit-r-13" data-row="0" data-col="2" title="r[1,3]">
                    <input type="number" step="1" id="edit-r-23" data-row="1" data-col="2" title="r[2,3]">
                    <input type="number" step="1" id="edit-r-33" data-row="2" data-col="2" title="r[3,3]">
                </div>
            </div>
        </div>
         <div id="xml-edit-info" class="info-text">ブロックが選択されていません。</div>
    </div>

    <canvas id="workbench-canvas"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="js/main.js"></script>
</body>
</html>
